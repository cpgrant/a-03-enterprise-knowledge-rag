[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "a03-enterprise-knowledge-rag"
version = "0.1.0"
description = "Enterprise Knowledge Intelligence with Hybrid RAG and GraphRAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "PyYAML>=6,<7",
    "networkx>=3,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
